[package]
name = "agent-skill-manager"
version = "0.0.11"
edition = "2024"
repository = "https://github.com/jroslaniec/agent-skill-manager"

[[bin]]
name = "sm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
fs2 = "0.4"
indicatif = "0.17"
anyhow = "1.0"
dirs = "5.0"
console = "0.15"
tempfile = "3.0"
chrono = "0.4"
inquire = "0.9.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
